version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      SA_PASSWORD: YourStrong!Passw0rd
      ACCEPT_EULA: Y
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'echo > /dev/tcp/localhost/1433' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - mssql_net

  sqlcmd-runner:
    build:
      context: .
      dockerfile: docker/sqlcmd.Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    entrypoint: ["/wait-for-it.sh", "sqlserver:1433", "--timeout=60", "--", "/opt/mssql-tools/bin/sqlcmd", "-S", "sqlserver", "-U", "sa", "-P", "YourStrong!Passw0rd", "-i", "/init.sql"]
    networks:
      - mssql_net

networks:
  mssql_net:
    driver: bridge
